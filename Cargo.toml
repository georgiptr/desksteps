[package]
name = "desksteps"
version = "1.0.0"
edition = "2024"
description = "Native Windows WalkingPad Z1 activity tracker and controls"
license = "MIT"
repository = "https://github.com/georgiptr/desksteps"
rust-version = "1.90"
publish = false
default-run = "desksteps"

[workspace]
members = ["xtask"]
default-members = ["."]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
    "Foundation", "Foundation_Collections", "Storage_Streams", "Globalization",
    "Devices_Bluetooth", "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_WinRT",
    "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_Storage_FileSystem", "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_Registry",
    "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage",
] }
windows-core = "0.62.2"
windows-future = "0.3.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
