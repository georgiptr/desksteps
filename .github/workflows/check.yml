name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools
          rustup default stable
      - name: Rust-only quality checks (no Bluetooth or interactive desktop required)
        run: cargo xtask quality --headless
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            target/coverage/gates.json
            target/coverage/lines.txt
          retention-days: 7
